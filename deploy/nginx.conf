# PERINGATAN: file ini hanya cetak biru untuk provisioning awal (deploy/setup.sh).
# Konfigurasi yang HIDUP ada di /etc/nginx/sites-enabled/kanban dan sudah berbeda —
# Certbot menambahkan blok "listen 443 ssl" + sertifikat Let's Encrypt di sana.
# Menyalin file ini menimpa konfigurasi live akan MEMATIKAN HTTPS situs.
# Untuk mengubah nginx produksi, edit langsung file di server.

server {
    listen 80;
    server_name kanban.balee.web.id;

    root /var/www/kanban/frontend/dist;
    index index.html;

    # API → backend
    location /api {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA — semua route ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
